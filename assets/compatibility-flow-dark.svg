<svg xmlns="http://www.w3.org/2000/svg" width="720" height="204" viewBox="0 0 720 204" role="img" aria-labelledby="title desc">
  <title id="title">ScarlettMac XCL compatibility flow</title>
  <desc id="desc">In ScarlettMac's XCL build, XCL supplies Xbox system services. Rosetta 2 runs x64 CPU code and D3DMetal runs the translated graphics on the Apple GPU.</desc>
  <rect x=".5" y=".5" width="719" height="203" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M207 102h38m193 0h24v-45h26m-26 45v45h26" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m240 97 8 5-8 5zm246-45 8 5-8 5zm0 90 8 5-8 5z" fill="#8b949e"/>
  <rect x="24" y="69" width="183" height="66" rx="9" fill="#151b23" stroke="#30363d"/>
  <rect x="248" y="69" width="190" height="66" rx="9" fill="#151b23" stroke="#30363d"/>
  <rect x="494" y="24" width="202" height="66" rx="9" fill="#13243b" stroke="#305379"/>
  <rect x="494" y="114" width="202" height="66" rx="9" fill="#10291b" stroke="#255c38"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g fill="#f0f6fc" font-size="18" font-weight="700">
      <text x="41" y="98">Xbox Series game</text>
      <text x="265" y="98">ScarlettMac / XCL</text>
      <text x="511" y="53">Rosetta 2</text>
      <text x="511" y="143">D3DMetal</text>
    </g>
    <g fill="#9198a1" font-size="13">
      <text x="41" y="116">Game executable</text>
      <text x="265" y="116">Xbox system services</text>
      <text x="511" y="71">x64 code on Apple Silicon</text>
      <text x="511" y="161">Graphics on the Mac GPU</text>
    </g>
  </g>
</svg>
