      <text x="46" y="304" fill="#1f2328" font-size="16" font-weight="650">Visible 3D scene</text>
      <text x="46" y="323" fill="#59636e" font-size="14">Render a live frame of the game world.</text>
      <rect x="278" y="291" width="66" height="22" rx="11" fill="#ddf4ff"/>
      <text x="311" y="306" text-anchor="middle" fill="#0969da" font-size="12" font-weight="700">Next</text>
