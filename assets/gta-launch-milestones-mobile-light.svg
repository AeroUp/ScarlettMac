      <rect x="308" y="67" width="16" height="8" rx="2" fill="#eef1f4" stroke="#d1d9e0"/>
      <rect x="326" y="67" width="16" height="8" rx="2" fill="#eef1f4" stroke="#d1d9e0"/>
    </g>
    <g>
      <circle cx="25" cy="115" r="8.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.25"/>
      <path d="m21 115 2.5 2.5 5-5" fill="none" stroke="#1a7f37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="112" fill="#1f2328" font-size="16" font-weight="650">Offline boot</text>
      <text x="46" y="131" fill="#59636e" font-size="14">Starts with network access disabled.</text>
      <rect x="278" y="99" width="66" height="22" rx="11" fill="#dafbe1"/>
      <text x="311" y="114" text-anchor="middle" fill="#1a7f37" font-size="12" font-weight="700">Verified</text>
    </g>
    <g>
      <circle cx="25" cy="163" r="8.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.25"/>
      <path d="m21 163 2.5 2.5 5-5" fill="none" stroke="#1a7f37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="160" fill="#1f2328" font-size="16" font-weight="650">Intro graphics</text>
      <text x="46" y="179" fill="#59636e" font-size="14">The opening graphics render.</text>
      <rect x="278" y="147" width="66" height="22" rx="11" fill="#dafbe1"/>
      <text x="311" y="162" text-anchor="middle" fill="#1a7f37" font-size="12" font-weight="700">Verified</text>
    </g>
