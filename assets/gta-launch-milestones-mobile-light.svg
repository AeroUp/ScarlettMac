<svg xmlns="http://www.w3.org/2000/svg" width="360" height="438" viewBox="0 0 360 438" role="img" aria-labelledby="title description">
  <title id="title">GTA VI launch milestones with ScarlettMac XCL</title>
  <desc id="description">ScarlettMac's XCL build reached four of seven stages on an Apple M3 Max. Offline boot, intro and menus are verified. Loading artwork and world asset reads were observed. A live 3D scene, gameplay controls and the first mission are open for this build.</desc>
  <rect x=".5" y=".5" width="359" height="437" rx="11" fill="#ffffff" stroke="#d1d9e0"/>
  <path d="M12 1h336a11 11 0 0 1 11 11v78H1V12A11 11 0 0 1 12 1Z" fill="#f6f8fa"/>
  <path d="M1 90.5h358M25 115v288" fill="none" stroke="#d1d9e0"/>
  <path d="M25 115v144" fill="none" stroke="#1a7f37" stroke-opacity=".65" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="16" y="29" fill="#1f2328" font-size="21" font-weight="700">World loading reached on XCL</text>
    <text x="16" y="49" fill="#59636e" font-size="14">Xbox Series 1.0.2.1 · Apple M3 Max</text>
    <text x="16" y="74" fill="#1f2328" font-size="13" font-weight="600">4 of 7 stages reached</text>
    <g>
      <rect x="218" y="67" width="16" height="8" rx="2" fill="#1a7f37"/>
      <rect x="236" y="67" width="16" height="8" rx="2" fill="#1a7f37"/>
