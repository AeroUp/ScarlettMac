      <text x="46" y="371" fill="#59636e" font-size="14">Verify movement and camera input.</text>
      <rect x="278" y="339" width="66" height="22" rx="11" fill="#eef1f4"/>
      <text x="311" y="354" text-anchor="middle" fill="#59636e" font-size="12" font-weight="700">Open</text>
    </g>
    <g>
      <circle cx="25" cy="403" r="8.5" fill="#ffffff" stroke="#59636e" stroke-width="1.25"/>
      <text x="46" y="400" fill="#1f2328" font-size="16" font-weight="650">First mission</text>
      <text x="46" y="419" fill="#59636e" font-size="14">Complete the opening mission in-game.</text>
      <rect x="278" y="387" width="66" height="22" rx="11" fill="#eef1f4"/>
      <text x="311" y="402" text-anchor="middle" fill="#59636e" font-size="12" font-weight="700">Open</text>
