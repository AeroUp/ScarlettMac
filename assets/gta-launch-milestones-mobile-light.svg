      <path d="m21 211 2.5 2.5 5-5" fill="none" stroke="#1a7f37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="208" fill="#1f2328" font-size="16" font-weight="650">Setup and menus</text>
      <text x="46" y="227" fill="#59636e" font-size="14">Controller input and about 30 FPS.</text>
      <rect x="278" y="195" width="66" height="22" rx="11" fill="#dafbe1"/>
      <text x="311" y="210" text-anchor="middle" fill="#1a7f37" font-size="12" font-weight="700">Verified</text>
    </g>
    <g>
      <circle cx="25" cy="259" r="8.5" fill="#fff1ce" stroke="#805b10" stroke-width="1.25"/>
      <circle cx="25" cy="259" r="3.25" fill="#805b10"/>
      <text x="46" y="256" fill="#1f2328" font-size="16" font-weight="650">World loading</text>
