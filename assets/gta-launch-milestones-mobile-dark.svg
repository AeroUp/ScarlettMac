      <rect x="308" y="67" width="16" height="8" rx="2" fill="#21262d" stroke="#30363d"/>
      <rect x="326" y="67" width="16" height="8" rx="2" fill="#21262d" stroke="#30363d"/>
    </g>
    <g>
      <circle cx="25" cy="115" r="8.5" fill="#102719" stroke="#3fb950" stroke-width="1.25"/>
      <path d="m21 115 2.5 2.5 5-5" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="112" fill="#f0f6fc" font-size="16" font-weight="650">Offline boot</text>
      <text x="46" y="131" fill="#9198a1" font-size="14">Starts with network access disabled.</text>
      <rect x="278" y="99" width="66" height="22" rx="11" fill="#102719"/>
