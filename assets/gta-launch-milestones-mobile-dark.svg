      <text x="311" y="354" text-anchor="middle" fill="#9198a1" font-size="12" font-weight="700">Open</text>
    </g>
    <g>
      <circle cx="25" cy="403" r="8.5" fill="#0d1117" stroke="#9198a1" stroke-width="1.25"/>
      <text x="46" y="400" fill="#f0f6fc" font-size="16" font-weight="650">First mission</text>
      <text x="46" y="419" fill="#9198a1" font-size="14">Complete the opening mission in-game.</text>
      <rect x="278" y="387" width="66" height="22" rx="11" fill="#21262d"/>
      <text x="311" y="402" text-anchor="middle" fill="#9198a1" font-size="12" font-weight="700">Open</text>
