      <text x="46" y="323" fill="#9198a1" font-size="14">Render a live frame of the game world.</text>
      <rect x="278" y="291" width="66" height="22" rx="11" fill="#13243b"/>
      <text x="311" y="306" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="700">Next</text>
