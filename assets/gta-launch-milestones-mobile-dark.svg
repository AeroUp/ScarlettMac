      <path d="m21 163 2.5 2.5 5-5" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="160" fill="#f0f6fc" font-size="16" font-weight="650">Intro graphics</text>
      <text x="46" y="179" fill="#9198a1" font-size="14">The opening graphics render.</text>
      <rect x="278" y="147" width="66" height="22" rx="11" fill="#102719"/>
      <text x="311" y="162" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">Verified</text>
