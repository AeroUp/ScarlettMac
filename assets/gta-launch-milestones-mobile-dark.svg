      <text x="46" y="208" fill="#f0f6fc" font-size="16" font-weight="650">Setup and menus</text>
      <text x="46" y="227" fill="#9198a1" font-size="14">Controller input and about 30 FPS.</text>
      <rect x="278" y="195" width="66" height="22" rx="11" fill="#102719"/>
      <text x="311" y="210" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">Verified</text>
    </g>
